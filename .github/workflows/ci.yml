name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `next build` también revisa los tipos de TypeScript (no hay script `typecheck`).
      # Valores ficticios: el build no los exige, pero así el bundle del navegador
      # se compila igual que en Vercel. No apuntan a ningún proyecto real.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-ficticio.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_ficticio

  db:
    name: Pruebas de base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Migraciones + pruebas de saldo, RLS, avisos y finanzas en un PostgreSQL desechable.
      # Solo usa bash y psql, así que no necesita `npm ci`.
      - run: npm run test:db
